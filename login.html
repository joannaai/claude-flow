<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aico LLC — Sign In</title>
    <link rel="stylesheet" href="styles.css?v=7">
</head>
<body>
    <button id="theme-toggle" class="theme-btn" style="position:fixed; top:1rem; right:1rem; z-index:10;">🌙</button>

    <main class="main-content" style="max-width:420px; margin:4rem auto;">
        <div class="section-header">
            <h2 id="form-title">Sign In</h2>
        </div>
        <div class="about-box">
            <form class="contact-form" id="auth-form">
                <input type="text" id="username" placeholder="Username" required class="form-input full-width" autocomplete="username">
                <input type="password" id="password" placeholder="Password" required class="form-input full-width" autocomplete="current-password">
                <input type="password" id="confirm-password" placeholder="Confirm Password" class="form-input full-width" autocomplete="new-password" style="display:none;">
                <button type="submit" class="submit-btn" id="submit-btn">Sign In</button>
            </form>
            <p id="auth-error" style="color:#c0392b; margin-top:1rem; display:none;"></p>
            <p style="text-align:center; margin-top:1rem; font-size:0.85rem;">
                <a href="#" id="toggle-mode" style="color: var(--text-tertiary);">Don't have an account? Create one</a>
            </p>
        </div>
    </main>

    <script>
        function setupTheme() {
            const themeBtn = document.getElementById("theme-toggle");
            if (localStorage.getItem("darkMode") === "true") document.body.classList.add("dark-mode");
            themeBtn.addEventListener("click", () => {
                document.body.classList.toggle("dark-mode");
                localStorage.setItem("darkMode", document.body.classList.contains("dark-mode"));
            });
        }

        async function init() {
            setupTheme();

            const form = document.getElementById("auth-form");
            const title = document.getElementById("form-title");
            const submitBtn = document.getElementById("submit-btn");
            const errorEl = document.getElementById("auth-error");
            const passwordInput = document.getElementById("password");
            const confirmInput = document.getElementById("confirm-password");
            const toggleLink = document.getElementById("toggle-mode");

            let isRegister = false;

            const applyMode = () => {
                title.textContent = isRegister ? "Create Account" : "Sign In";
                submitBtn.textContent = isRegister ? "Create Account" : "Sign In";
                passwordInput.autocomplete = isRegister ? "new-password" : "current-password";
                passwordInput.placeholder = isRegister ? "Password (min. 8 characters)" : "Password";
                confirmInput.style.display = isRegister ? "block" : "none";
                confirmInput.required = isRegister;
                if (!isRegister) confirmInput.value = "";
                toggleLink.textContent = isRegister ? "Already have an account? Sign in" : "Don't have an account? Create one";
                errorEl.style.display = "none";
            };

            toggleLink.addEventListener("click", (e) => {
                e.preventDefault();
                isRegister = !isRegister;
                applyMode();
            });

            try {
                const me = await fetch('/api/auth/me').then(r => r.json());
                if (me.authenticated) {
                    location.href = '/letter.html';
                    return;
                }
            } catch (err) {
                // If /api/auth/me fails, just fall back to a normal login form.
            }

            form.addEventListener("submit", async (e) => {
                e.preventDefault();
                errorEl.style.display = "none";

                if (isRegister && passwordInput.value !== confirmInput.value) {
                    errorEl.textContent = "Passwords do not match.";
                    errorEl.style.display = "block";
                    return;
                }

                submitBtn.disabled = true;

                try {
                    const response = await fetch(isRegister ? '/api/auth/register' : '/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            username: document.getElementById("username").value,
                            password: document.getElementById("password").value,
                        }),
                    });
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error || 'Something went wrong');
                    location.href = '/letter.html';
                } catch (err) {
                    errorEl.textContent = err.message;
                    errorEl.style.display = "block";
                    submitBtn.disabled = false;
                }
            });
        }

        document.addEventListener("DOMContentLoaded", init);
    </script>
</body>
</html>
