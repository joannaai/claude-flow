<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aico LLC — Sign In</title>
    <link rel="stylesheet" href="styles.css?v=7">
</head>
<body>
    <button id="theme-toggle" class="theme-btn" style="position:fixed; top:1rem; right:1rem; z-index:10;">🌙</button>

    <main class="main-content" style="max-width:420px; margin:4rem auto;">
        <div class="section-header">
            <h2 id="form-title">Sign In</h2>
        </div>
        <div class="about-box">
            <form class="contact-form" id="auth-form">
                <input type="text" id="username" placeholder="Username" required class="form-input full-width" autocomplete="username">
                <input type="password" id="password" placeholder="Password" required class="form-input full-width" autocomplete="current-password">
                <input type="password" id="confirm-password" placeholder="Confirm Password" class="form-input full-width" autocomplete="new-password" style="display:none;">
                <button type="submit" class="submit-btn" id="submit-btn">Sign In</button>
            </form>
            <p id="auth-error" style="color:#c0392b; margin-top:1rem; display:none;"></p>
            <button type="button" class="submit-btn" id="reset-btn" style="display:none; margin-top:0.75rem; width:100%;">Reset password</button>
            <p id="auth-info" style="color:#27ae60; margin-top:1rem; display:none;"></p>
            <p style="text-align:center; margin-top:1rem; font-size:0.85rem;">
                <a href="#" id="toggle-mode" style="color: var(--text-tertiary);">Don't have an account? Create one</a>
            </p>
            <p style="text-align:center; margin-top:0.5rem; font-size:0.85rem;">
                <a href="#" id="forgot-link" style="color: var(--text-tertiary);">Forgot password?</a>
            </p>
        </div>
    </main>

    <script>
        function setupTheme() {
            const themeBtn = document.getElementById("theme-toggle");
            if (localStorage.getItem("darkMode") === "true") document.body.classList.add("dark-mode");
            themeBtn.addEventListener("click", () => {
                document.body.classList.toggle("dark-mode");
                localStorage.setItem("darkMode", document.body.classList.contains("dark-mode"));
            });
        }

        async function init() {
            setupTheme();

            const form = document.getElementById("auth-form");
            const title = document.getElementById("form-title");
            const submitBtn = document.getElementById("submit-btn");
            const errorEl = document.getElementById("auth-error");
            const passwordInput = document.getElementById("password");
            const confirmInput = document.getElementById("confirm-password");
            const toggleLink = document.getElementById("toggle-mode");

            const infoEl = document.getElementById("auth-info");
            const usernameInput = document.getElementById("username");
            const forgotLink = document.getElementById("forgot-link");
            const resetBtn = document.getElementById("reset-btn");
            const resetToken = new URLSearchParams(location.search).get("reset");

            // signin | register | forgot | reset
            let mode = resetToken ? "reset" : "signin";

            const applyMode = () => {
                const isRegister = mode === "register";
                const isForgot = mode === "forgot";
                const isReset = mode === "reset";
                const needsConfirm = isRegister || isReset;

                title.textContent = { signin: "Sign In", register: "Create Account", forgot: "Reset Password", reset: "Choose a New Password" }[mode];
                submitBtn.textContent = { signin: "Sign In", register: "Create Account", forgot: "Send Reset Link", reset: "Update Password" }[mode];
                usernameInput.style.display = isReset ? "none" : "block";
                usernameInput.required = !isReset;
                usernameInput.placeholder = isForgot ? "Your username (email address)" : "Username";
                passwordInput.style.display = isForgot ? "none" : "block";
                passwordInput.required = !isForgot;
                passwordInput.autocomplete = needsConfirm ? "new-password" : "current-password";
                passwordInput.placeholder = needsConfirm ? "Password (min. 8 characters)" : "Password";
                confirmInput.style.display = needsConfirm ? "block" : "none";
                confirmInput.required = needsConfirm;
                if (!needsConfirm) confirmInput.value = "";
                toggleLink.textContent = isRegister ? "Already have an account? Sign in"
                    : (isForgot || isReset) ? "Back to sign in" : "Don't have an account? Create one";
                forgotLink.style.display = mode === "signin" ? "inline" : "none";
                errorEl.style.display = "none";
                infoEl.style.display = "none";
                resetBtn.style.display = "none";
            };

            toggleLink.addEventListener("click", (e) => {
                e.preventDefault();
                mode = mode === "signin" ? "register" : "signin";
                if (resetToken) history.replaceState(null, "", location.pathname);
                applyMode();
            });

            const openForgot = () => {
                mode = "forgot";
                applyMode();
            };
            forgotLink.addEventListener("click", (e) => {
                e.preventDefault();
                openForgot();
            });
            resetBtn.addEventListener("click", openForgot);

            applyMode();

            try {
                const me = await fetch('/api/auth/me').then(r => r.json());
                if (me.authenticated && !resetToken) {
                    location.href = '/letter.html';
                    return;
                }
            } catch (err) {
                // If /api/auth/me fails, just fall back to a normal login form.
            }

            form.addEventListener("submit", async (e) => {
                e.preventDefault();
                errorEl.style.display = "none";
                infoEl.style.display = "none";
                resetBtn.style.display = "none";

                if ((mode === "register" || mode === "reset") && passwordInput.value !== confirmInput.value) {
                    errorEl.textContent = "Passwords do not match.";
                    errorEl.style.display = "block";
                    return;
                }

                submitBtn.disabled = true;

                try {
                    const endpoint = { signin: '/api/auth/login', register: '/api/auth/register', forgot: '/api/auth/forgot', reset: '/api/auth/reset' }[mode];
                    const body = mode === "forgot" ? { username: usernameInput.value }
                        : mode === "reset" ? { token: resetToken, password: passwordInput.value }
                        : { username: usernameInput.value, password: passwordInput.value };
                    const response = await fetch(endpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(body),
                    });
                    const data = await response.json();
                    if (!response.ok) {
                        if (mode === "signin" && response.status === 401) resetBtn.style.display = "block";
                        throw new Error(data.error || 'Something went wrong');
                    }

                    if (mode === "forgot") {
                        infoEl.textContent = "If that account exists and its username is an email address, a reset link is on its way.";
                        infoEl.style.display = "block";
                        submitBtn.disabled = false;
                    } else if (mode === "reset") {
                        history.replaceState(null, "", location.pathname);
                        mode = "signin";
                        passwordInput.value = "";
                        applyMode();
                        infoEl.textContent = "Password updated. Sign in with your new password.";
                        infoEl.style.display = "block";
                        submitBtn.disabled = false;
                    } else {
                        location.href = '/letter.html';
                    }
                } catch (err) {
                    errorEl.textContent = err.message;
                    errorEl.style.display = "block";
                    submitBtn.disabled = false;
                }
            });
        }

        document.addEventListener("DOMContentLoaded", init);
    </script>
</body>
</html>
